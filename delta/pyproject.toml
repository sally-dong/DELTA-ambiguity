[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-ambiguity"
version = "0.3.0"
description = "Measure ambiguity in prescriptive text as interpretive disagreement"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sally Dong" },
    { name = "Luke Thorburn" },
    { name = "Andrew Konya" },
    { name = "Michiel Bakker" },
]
keywords = ["ambiguity", "policy", "nlp", "llm", "deliberation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "google-genai>=0.1.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
# Running open-weight models locally. Several GB; not needed for API use.
local = [
    "torch",
    "transformers",
    "bitsandbytes",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/sally-dong/DELTA-ambiguity"
Repository = "https://github.com/sally-dong/DELTA-ambiguity"

[project.scripts]
delta-generate = "delta.generate:main"
delta-run = "delta.experiment:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
